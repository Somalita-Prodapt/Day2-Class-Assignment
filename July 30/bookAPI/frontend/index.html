<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#eef2f7;
            padding:40px;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:auto;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#2c3e50;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            margin-bottom:30px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:15px;
        }

        input,
        select{
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#3498db;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:15px;
            transition:.3s;
        }

        #submitBtn{
            background:#3498db;
            color:white;
        }

        #submitBtn:hover{
            background:#2980b9;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
            background:white;
            overflow:hidden;
            border-radius:8px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        th{
            background:#3498db;
            color:white;
            padding:15px;
        }

        td{
            padding:14px;
            border-bottom:1px solid #eee;
            text-align:center;
        }

        tr:hover{
            background:#f8f9fa;
        }

        .edit-btn{
            background:#27ae60;
            color:white;
            margin-right:8px;
        }

        .edit-btn:hover{
            background:#219150;
        }

        .delete-btn{
            background:#e74c3c;
            color:white;
        }

        .delete-btn:hover{
            background:#c0392b;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .status{
            padding:6px 12px;
            border-radius:20px;
            color:white;
            font-size:13px;
        }

        .available{
            background:#2ecc71;
        }

        .borrowed{
            background:#f39c12;
        }

        @media(max-width:768px){

            table{
                font-size:14px;
            }

            td,
            th{
                padding:10px;
            }

            button{
                margin-bottom:5px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>📚 Book Catalog Management</h1>

    <div class="card">

        <form id="bookForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="title"
                    placeholder="Book Title"
                    required
                >

                <input
                    type="text"
                    id="author"
                    placeholder="Author"
                    required
                >

                <input
                    type="text"
                    id="genre"
                    placeholder="Genre"
                >

                <select id="status">
                    <option value="available">Available</option>
                    <option value="borrowed">Borrowed</option>
                </select>

            </div>

            <br>

            <button id="submitBtn" type="submit">
                Add Book
            </button>

        </form>

    </div>

    <div class="card">

        <div class="header">

            <h2>Book List</h2>

        </div>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Genre</th>
                <th>Status</th>
                <th>Added On</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody id="bookTable">

            </tbody>

        </table>

    </div>

</div>

<script>

const API_URL = "http://127.0.0.1:8000/books/";

const form = document.getElementById("bookForm");
const table = document.getElementById("bookTable");
const submitBtn = document.getElementById("submitBtn");

let editId = null;
// Load all books
async function loadBooks() {

    const response = await fetch(API_URL);
    const books = await response.json();

    table.innerHTML = "";

    books.forEach(book => {

        const statusClass =
            book.status === "available"
                ? "available"
                : "borrowed";

        table.innerHTML += `

        <tr>

            <td>${book.id}</td>

            <td>${book.title}</td>

            <td>${book.author}</td>

            <td>${book.genre ?? ""}</td>

            <td>
                <span class="status ${statusClass}">
                    ${book.status}
                </span>
            </td>

            <td>
                ${new Date(book.added_at).toLocaleDateString()}
            </td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editBook(${book.id})">

                    Edit

                </button>

                <button
                    class="delete-btn"
                    onclick="deleteBook(${book.id})">

                    Delete

                </button>

            </td>

        </tr>

        `;
    });

}



// Add or Update Book
form.addEventListener("submit", async function (e) {

    e.preventDefault();

    const book = {

        title: document.getElementById("title").value,

        author: document.getElementById("author").value,

        genre: document.getElementById("genre").value,

        status: document.getElementById("status").value

    };



    if (editId === null) {

        await fetch(API_URL, {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify(book)

        });

    }

    else {

        await fetch(API_URL + editId, {

            method: "PUT",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify(book)

        });

        editId = null;

        submitBtn.innerText = "Add Book";

    }

    form.reset();

    loadBooks();

});



// Edit Book
async function editBook(id) {

    const response = await fetch(API_URL + id);

    const book = await response.json();

    document.getElementById("title").value = book.title;

    document.getElementById("author").value = book.author;

    document.getElementById("genre").value = book.genre;

    document.getElementById("status").value = book.status;

    editId = id;

    submitBtn.innerText = "Update Book";

}



// Delete Book
async function deleteBook(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this book?"
    );

    if (!confirmDelete)
        return;

    await fetch(API_URL + id, {

        method: "DELETE"

    });

    loadBooks();

}



// Initial Load
loadBooks();

</script>

</body>

</html>
